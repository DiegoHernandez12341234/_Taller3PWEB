<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <title>Title</title>
</head>
<body>
    <div class="container">
        <form action="/ejercicio1" method="POST">
            <label for="nota1">Nota 1 (10-70):</label>
            <input type="number" id="nota1" name="nota1" required>
            <br>
            <label for="nota2">Nota 2 (10-70):</label>
            <input type="number" id="nota2" name="nota2" required>
            <br>
            <label for="nota3">Nota 3 (10-70):</label>
            <input type="number" id="nota3" name="nota3" required>
            <br>
            <label for="asistencia">Asistencia (0-100%):</label>
            <input type="number" id="asistencia" name="asistencia" required>
            <br>
            <button type="submit">Enviar</button>
        </form>
    </div>
    {% if resultado %}
        <div class="container">
            <p>Promedio: {{promedio}}</p>
            <p>Estado: {{resultado}}</p>
        </div>
    {% endif %}
</body>
</html>
